camera_node:
  ros__parameters:
    mode: gstreamer
    width: 1224
    height: 1024
    fps: 20.0
    frame_id: camera_optical_frame
    gstreamer_pipeline: >-
      aravissrc camera-name=FLIR-1E100152397C-0152397C
      features="TriggerMode=Off Width=2448 Height=2048 PixelFormat=BayerRG8"
      ! video/x-bayer,format=rggb,width=2448,height=2048
      ! bayer2rgb
      ! videoconvert
      ! videoscale
      ! video/x-raw,format=BGR,width=1224,height=1024
      ! appsink drop=true max-buffers=1 sync=false

h_tracker:
  ros__parameters:
    # Five-frame median center motion at or above this value keeps the clip.
    recording_movement_threshold_mm: 0.5
    # Static deletion requires reliable tracking; lower coverage is kept as indeterminate.
    recording_minimum_detection_fraction: 0.8
