network:
  robot_ip: 192.168.56.101
  control_pc_ip: 192.168.56.1
  external_control_port: 50002

robot:
  type: ur3
  calibration_file: /home/yc/UR3/config/ur3_calibration.yaml
  # Centre of the 30 x 30 mm axial magnet in tool0 coordinates.
  magnet_tcp_xyz_m: [0.0, 0.0, 0.0975]
  magnet_tcp_rpy_rad: [0.0, 0.0, 0.0]
  magnet_cylinder_radius_m: 0.015
  magnet_cylinder_length_m: 0.030
  magnet_axis_tool_vector: [1.0, 0.0, 0.0]
  magnet_grade: N52
  motor_model: HT4510-J10-2E
  payload_mass_kg: 0.54
  motor_axis_tool_vector: [0.0, 0.0, 1.0]
  # Shaft is coaxial with tool0 Z; the user updated the teach pendant.
  motor_axis_verified: true

camera:
  serial: "22165884"
  width: 2448
  height: 2048
  target_fps: 30.0
  frame_id: camera_optical_frame

safety:
  # Acrylic and table clearances used by planning and live geometry checks.
  clearance_policy_m:
    acrylic_bottom: 0.005
    side: 0.010
    table: 0.010

# 相机与磁铁支架固定后再测量这些参数。
calibration:
  camera_matrix:
    - [3625.088677168018, 0.0, 1200.123248394464]
    - [0.0, 3630.425985277284, 1067.173693198475]
    - [0.0, 0.0, 1.0]
  distortion_coefficients: [-0.274982454144, 1.568575307653, 0.0, 0.0, 0.0]
  # Maps undistorted image pixels to world X/Y on acrylic world z=0.498141 m.
  image_to_workspace_homography:
    - [0.000103078658415, 0.000001546589360, 0.064584177671]
    - [0.000001644476475, -0.000102647465603, 0.269099451973]
    - [0.000001105524938, 0.000000431915695, 1.0]
  workspace_to_base_transform:
    - [-0.999972620, 0.007397899, -0.000175681, 0.276097000]
    - [-0.007397883, -0.999972631, -0.000088533, -0.248236000]
    - [-0.000176331, -0.000087231, 0.999999981, -0.016152000]
    - [0.0, 0.0, 0.0, 1.0]
  camera_robot_file: /home/yc/UR3/config/camera_robot_calibration.yaml
  # Encoder 0 degrees: magnet N points along tool0 +X (confirmed by user).
  motor_phase_zero_rad: 0.0
  # Observed at +90 degrees: magnet N turns from tool0 +X toward -Y.
  motor_phase_sign: -1
  # Magnet is fixed directly to the motor shaft: one reported turn is one magnet turn.
  motor_encoder_turns_per_magnet_turn: 1.0
