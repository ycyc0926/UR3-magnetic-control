# Conditional interpretation: bracket thickness along tool0 Y, bracket's
# motor-side face at Y=+4 mm; 42 mm body extends to +Y. Shaft center X=0,Z=41 mm.
# The 43 mm square faces are assumed aligned with tool0 X/Z.
conditional_motor_body:
  placement_confirmed: false
  min_xyz_m: [-0.0215, 0.004, 0.0195]
  max_xyz_m: [0.0215, 0.046, 0.0625]
  excludes: [connector, protruding_screws, wiring, bracket, connecting_rod]

# Deliberately larger than the known motor/sphere/shaft-center dimensions.
# Bounds are a PROPOSED enclosing volume, not measured physical dimensions.
# Inclusion of bracket/protrusions is still subject to onsite verification.
# No possible successful diagnostic grants real-hardware execution permission.
provisional_whole_tool_envelope:
  verified_encloses_all_rigid_parts: false
  min_xyz_m: [-0.030, -0.075, -0.005]
  max_xyz_m: [0.030, 0.050, 0.070]
  cable_geometry_included: false
  based_on: '实测电机/球心尺寸、照片及用户对固定件大小的描述，额外放大；不是逐项测量结果'

missing_for_complete_collision_model:
  # Verifying the proposed envelope encloses the parts is sufficient for a
  # conservative clearance test; exact dimensions of every part are optional.
  - verify_whole_tool_envelope_encloses_bracket_rod_and_protrusions
  - platform_supports_and_other_relevant_obstacles
# Cable freedom is a user/onsite assessment, not a modeled or universal guarantee.
